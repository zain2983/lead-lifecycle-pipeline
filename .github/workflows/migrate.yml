name: migrate

# Runs database migrations on every push to main, before or alongside Vercel's Git deploy. Migrations stay
# additive (expand -> deploy -> contract), so code that is already running survives the race.
on:
  push:
    branches: [main]
    paths:
      - "packages/db/prisma/**"
      - "packages/queue/**"
      - ".github/workflows/migrate.yml"
  workflow_dispatch:

concurrency:
  group: migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      # Session pooler (:5432). Never the direct db.<ref>.supabase.co host: it is IPv6-only and runners are IPv4.
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Require the database secret
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::DIRECT_URL secret is not set for the production environment"; exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Prisma migrations
        run: pnpm db:deploy
      - name: pg-boss schema
        run: pnpm --filter @repo/queue run migrate
